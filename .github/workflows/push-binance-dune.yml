name: Push Binance OHLC to Dune

on:
  schedule:
    # 06:00 UTC daily. GitHub may delay scheduled runs by a few minutes at peak;
    # that's fine because yesterday's Binance dump is already published by 06:00.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Never let two runs overlap (a slow run + the next schedule).
concurrency:
  group: push-binance-dune
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch last 7 days and push to Dune
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          # Binance spot symbols (base+quote, no separator). Unlisted symbols
          # are skipped automatically. Note: USDC/USD1 is listed as USD1USDC.
          # Leave this unset to use the defaults baked into the script.
          SYMBOLS: "SOLUSDC,USDCUSDT,SOLUSDT,USD1USDC,SOLUSD1,PUMPUSDC,ZECUSDC,HYPEUSDC,BONKUSDC,PENGUUSDC,TRUMPUSDC"
          DAYS: "7"
        run: python push_binance_to_dune.py
